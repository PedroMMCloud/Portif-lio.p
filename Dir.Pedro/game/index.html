<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joguinho</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box; 
        }
        body{
            display: grid;
            place-items: center;
            height: 50vh;
            background-color: rgb(3, 123, 27);
        }
        .road{
            width: 60%;
            height: 100vh;
            background-image: url(./road.png);
            background-size: 100% auto;
            background-repeat: repeat-y;
            image-rendering: pixelated;
            background-position: 50% 50%;
            animation: roadmove 4s infinite linear;
        }
        @keyframes roadmove {
            0%{background-position: 0 0;}
            100%{background-position: 0 100vh;}
        }
        #car {
            position: absolute;
            width: 17%;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>
    <div class="road">
        <img src="./car.png" alt="carrinhoooo" id= "car">
    </div>
    <script>
        var move=10;
        var car=document.getElementById("car");
        window.onload=()=> {
            car.style.position="absolute";
            car.style.bottom=0
            car.style.top=1
            car.style.left=-1
        }
        window.onkeydown=(e) => {
            switch (e.key) {
            case 'ArrowDown':
                car.style.top = car.offsetTop + move + 'px';
                break;
            case 'ArrowUp':
                car.style.top = car.offsetTop - move + 'px';
                break;
            case 'ArrowRight':
                car.style.left = car.offsetLeft + move + 'px';
                break;
            case 'ArrowLeft':
                car.style.left = car.offsetLeft - move + 'px';
                break;
            }
        }
    </script>
</body>
</html>
